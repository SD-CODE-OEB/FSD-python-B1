<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Explore</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* body {
      background-color: black;
      color: white;
    } */

    header {
      background-color: aliceblue;
      height: 80px;
      width: 100%;
      padding: 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      left: 0;
    }

    header .logo {
      height: 60px;
    }

    .navbar {
      height: 100%;
    }

    .navbar .links-list {
      list-style-type: lower-roman;
      list-style-type: none;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .navbar .links-list li {

      margin: 0 20px;
    }

    .navbar .links-list a {
      color: black;
      text-decoration: none;
    }

    .section-100 {
      height: 100vh;
    }

    .section-50 {
      height: 50vh;
    }

    .section-200 {
      height: 200vh;
    }

    #hero-section {
      background-image: url('https://www.travelexplorer.in/wp-content/themes/travelexplorer/images/bg-promo-2.jpg');
      background-repeat: no-repeat;
      background-size: cover;
    }

    #explore-section {
      background-image: url('https://www.travelexplorer.in/wp-content/themes/travelexplorer/images/intro-3.jpg');
      background-repeat: no-repeat;
      background-size: cover;
    }

    #travel-exp-section {
      background: linear-gradient(45deg, transparent, yellow, orange, transparent);
      /* background: radial-gradient(circle, 10% red, 40% yellow, 90% orange, black); */
    }
  </style>
</head>

<body>
  <header>
    <img src="https://www.travelexplorer.in/wp-content/themes/travelexplorer/images/logo-text-dark.png"
      alt="TravelExplorer" class="logo" />

    <nav class="navbar">

      <ul class="links-list">
        <li>
          <a href="#hero-section">
            Home
          </a>
        </li>
        <li>
          <a href="#explore-section">
            Explore
          </a>
        </li>
        <li>
          <a href="#travel-exp-section">
            Travel Explorer
          </a>
        </li>
        <li>
          <a href="#travel-us-section">
            With us
          </a>
        </li>

        <li>
          <a href="#travel-dest-section">
            Destinations
          </a>
        </li>

        <li>
          <a href="#help-section">
            Help
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section-100" id="hero-section">
      <h1>Hero Section</h1>
    </section>
    <section class="section-100" id="explore-section">
      Lets explore
    </section>
    <section class="section-100" id="travel-exp-section">
      we are travel explorers
    </section>
    <section class="section-100" id="travel-us-section">
      why travel with us
    </section>
    <section class="section-200" id="travel-dest-section">
      Travel explorers destinations
    </section>
    <section class="section-50"> we can also help</section>
    <section class="section-100" id="help-section">client feedback</section>

  </main>

  <footer>

  </footer>
</body>

</html>
