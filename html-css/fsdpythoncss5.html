<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grids</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .box {
      height: 90vh;
      width: 95%;
      background-color: aliceblue;
      border: 2px solid black;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 2fr 1fr 1.3fr;
      gap: 20px;
      padding: 20px;
    }

    .s-box {
      width: 100%;
      height: 100%;
      border: 2px solid red;
      background-color: yellow;
    }

    .b1 {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
    }

    .b2 {
      grid-column: 3 / 4;
      grid-row: 1 / 2;
    }

    .b3 {
      grid-column: 1 / 2;
      grid-row: 3 / 4;
    }

    .b4 {
      grid-column: 2 / 3;
      grid-row: 3 / 4;
    }

    .b5 {
      grid-column: 3 / 4;
      grid-row: 2 / 4;
    }
  </style>
</head>

<body>
  <h1>Grids</h1>

  <div class="box">

    <div class="s-box b1"></div>
    <div class="s-box b2"></div>
    <div class="s-box b3"></div>
    <div class="s-box b4"></div>
    <div class="s-box b5"></div>
    <!-- <div class="s-box"></div>
    <div class="s-box"></div>
    <div class="s-box"></div>
    <div class="s-box"></div>
    <div class="s-box"></div> -->
  </div>

</body>

</html>
