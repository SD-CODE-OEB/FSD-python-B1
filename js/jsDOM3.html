<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Propagation</title>
  <style>
    div {
      padding: 30px;
      border: 2px solid #333;
      margin: 10px;
      border-radius: 8px;
    }

    #grandparent {
      background-color: #ffcdd2;
    }

    #parent {
      background-color: #bbdefb;
    }

    #child {
      background-color: #c8e6c9;
    }
  </style>
</head>

<body>

  <div id="grandparent">
    Grandparent
    <div id="parent">
      Parent
      <div id="child">
        Child
      </div>
    </div>
  </div>

  <script>
    const grandparent = document.querySelector('#grandparent');
    const parent = document.querySelector('#parent');
    const child = document.querySelector('#child');

    grandparent.addEventListener('click', () => console.log('1. Grandparent clicked'));
    parent.addEventListener('click', () => console.log('2. Parent clicked'));
    child.addEventListener('click', (e) => {
      e.stopPropagation()
      console.log('3. Child clicked')
    });


  </script>
</body>

</html>
