<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning use of JS in browser</title>
</head>

<body>
  <!-- <p>contet</p> -->
  <div>
    div tag
    <p> p tag</p>
    <button type="submit" onclick={clickMe()}>button</button>
  </div>

  <script>
    console.log("Hello worlds")
    const htmlBody = document.body;
    // htmlBody.textContent = "THis is my text from javascript in body"
    htmlBody.style.backgroundColor = "black"
    htmlBody.style.color = "white"

    const pTag = document.querySelector('p');
    console.log(pTag, pTag)


    const buttonTag = document.querySelector('button')
    console.log(buttonTag)




    function clickMe() {
      console.log(" I am button")
      buttonTag.textContent = "Clicked"
      buttonTag.style.color = "red"
    }

    buttonTag.addEventListener("keydown", () => {
      pTag.textContent = "keypressed"
    })
    buttonTag.addEventListener('hover', () => {
      console.log("I am being clicked from eventListener")
    })
    // for (let i = 0; i <= pTag.length; i++) {

    //   pTag[i].textContent = 'this is p tag in HTML';
    // }
  </script>
</body>

</html>
